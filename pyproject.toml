[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeodata-browser"
description = "Registry browser (QC and code-review dashboard) for pygeodata"
authors = [
    { name = "Jasper Roebroek", email = "roebroek.jasper@gmail.com" }
]
dynamic = ["version"]  # from the git tag (setuptools-scm)
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygeodata>=0.4,<0.5",  # needs the 0.4 identity-aware instance hashes (pins table, partial specs)
    "flask",
]

[project.urls]
Repository = "https://github.com/jasperroebroek/pygeodata-browser"
Issues = "https://github.com/jasperroebroek/pygeodata-browser/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[tool.setuptools_scm]

[tool.setuptools.package-dir]
pygeodata_browser = "api"

# static/app/ is the built frontend: `npm run build` in app/ writes it, the release
# workflow builds it before packaging, and it is not committed. app/ (the Svelte
# source) is not packaged.
[tool.setuptools.package-data]
pygeodata_browser = [
    "static/app/**/*",
]

[tool.setuptools.exclude-package-data]
pygeodata_browser = [".DS_Store", "**/.DS_Store"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
