[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeodata-browser"
description = "Registry browser (QC and code-review dashboard) for pygeodata"
authors = [
    { name = "Jasper Roebroek", email = "roebroek.jasper@gmail.com" }
]
dynamic = ["version"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "pygeodata>=0.3",
    "flask",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[tool.setuptools.dynamic]
version = { attr = "pygeodata_browser.__version__" }

[tool.setuptools.package-dir]
pygeodata_browser = "api"

[tool.setuptools.package-data]
pygeodata_browser = [
    "static/**/*",
    "templates/**/*",
]  # static/app/* is the built Svelte frontend (app/ is its source)

[tool.setuptools.exclude-package-data]
pygeodata_browser = [".DS_Store", "**/.DS_Store"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
