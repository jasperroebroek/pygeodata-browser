# Push a version tag (e.g. `git tag v0.1.0 && git push --tags`) to publish to PyPI;
# the tag is the version (setuptools-scm).
# The frontend is compiled here and shipped prebuilt; users never need Node.
# PyPI authenticates this workflow via trusted publishing (no API token): add it
# as a trusted publisher on PyPI (workflow `release.yml`, environment `pypi`).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from git tags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the frontend
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Check the distributions ship the built frontend
        run: python scripts/check_dist.py dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
